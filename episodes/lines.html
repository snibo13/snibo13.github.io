<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snapping Option Selector</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* Custom styles for the timeline */
        body {
            font-family: 'Inter', sans-serif;
            scroll-behavior: smooth;
            /* Enables smooth scrolling for the whole page */
        }

        /* Custom scrollbar for better aesthetics */
        .timeline-container::-webkit-scrollbar {
            height: 8px;
            display: none;
        }

        .timeline-container::-webkit-scrollbar-track {
            background: #f1f5f9;
            /* gray-100 */
            border-radius: 10px;
        }

        .timeline-container::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            /* gray-300 */
            border-radius: 10px;
        }

        .timeline-container::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
            /* gray-400 */
        }

        /* Ensures the timeline doesn't wrap and stays in a single line */
        .timeline {
            white-space: nowrap;
        }

        .timeline-marker {
            /* Smooth transition for height changes */
            transition: height 75ms ease-out;
        }
    </style>
</head>

<body class="bg-gray-50 flex items-center justify-center h-screen p-4 sm:p-6 lg:p-8">

    <div class="w-full max-w-6xl mx-auto flex flex-col items-center">
        <!-- Display for the currently selected option -->
        <div class="mb-8 h-10">
            <h2 id="option-display"
                class="text-3xl font-bold text-gray-800 text-center transition-opacity duration-300"></h2>
        </div>

        <!-- Main container that provides the scrolling viewport -->
        <div id="timeline-container"
            class="timeline-container relative w-full h-40 bg-white border border-gray-200 rounded-lg shadow-sm overflow-x-auto cursor-grab active:cursor-grabbing">

            <!-- The timeline itself, which is much wider than the container -->
            <div id="timeline" class="relative h-full flex">
                <!-- Markers will be generated by JavaScript here -->
            </div>
        </div>
    </div>

    <script>
        var closestIndex = -1;
        document.addEventListener('DOMContentLoaded', () => {
            const timeline = document.getElementById('timeline');
            const timelineContainer = document.getElementById('timeline-container');
            const optionDisplay = document.getElementById('option-display');

            // --- Configuration ---
            const options = ["Turn off the alarm", "Snooze", "Up and At 'Em"];
            const markersPerOption = 10; // Number of small lines between each main option
            const pixelsPerOption = 300; // The width between each main option
            const totalWidth = (options.length - 1) * pixelsPerOption;

            /**
             * Renders the option blocks and the vertical line markers on the timeline.
             */
            function renderTimeline() {
                timeline.innerHTML = ''; // Clear existing timeline
                // Add padding to the start and end so the first and last options can be centered
                const padding = (timelineContainer.clientWidth / 2);
                timeline.style.width = `${totalWidth + (padding * 2)}px`;
                timeline.style.paddingLeft = `${padding}px`;
                timeline.style.paddingRight = `${padding}px`;

                options.forEach((option, index) => {
                    const optionWrapper = document.createElement('div');
                    optionWrapper.className = 'relative';
                    optionWrapper.style.width = `${pixelsPerOption}px`;

                    // Create the main marker for the option (the snap target)
                    const mainMarker = document.createElement('div');
                    mainMarker.className = 'timeline-marker option-marker absolute bottom-0 w-0.5 bg-gray-600';
                    mainMarker.dataset.option_name = option;
                    mainMarker.dataset.index = index;
                    optionWrapper.appendChild(mainMarker);

                    // Create the smaller markers between this option and the next
                    if (index < options.length) {
                        for (let j = 1; j < markersPerOption; j++) {
                            const lineMarker = document.createElement('div');
                            lineMarker.className = `timeline-marker absolute bottom-0 w-px bg-gray-200`;
                            lineMarker.style.left = `${(j / markersPerOption) * 100}%`;
                            optionWrapper.appendChild(lineMarker);
                            // Add marker on the opposite side for symmetry
                            const lineMarkerOpposite = document.createElement('div');
                            lineMarkerOpposite.className = `timeline-marker absolute bottom-0 w-px bg-gray-200`;
                            lineMarkerOpposite.style.left = `-${(j / markersPerOption) * 100}%`;
                            optionWrapper.appendChild(lineMarkerOpposite);

                        }
                    }
                    timeline.appendChild(optionWrapper);
                });
            }

            /**
             * Updates the height of each line marker based on its distance from the center.
             */
            function updateLineHeights() {
                const containerRect = timelineContainer.getBoundingClientRect();
                const containerCenter = containerRect.left + containerRect.width / 2;

                const markers = document.querySelectorAll('.timeline-marker');
                const maxHeight = 80;
                const minHeight = 10;
                const sigma = 100;

                var minDistance = Infinity;
                var localClosestIndex = -1;

                markers.forEach(marker => {
                    const markerRect = marker.getBoundingClientRect();
                    if (markerRect.right < containerRect.left || markerRect.left > containerRect.right) {
                        marker.style.height = `${minHeight}px`;
                        return;
                    }
                    const markerCenter = markerRect.left + markerRect.width / 2;
                    const distance = Math.abs(containerCenter - markerCenter);
                    if (distance < minDistance && marker.dataset.index !== undefined) {
                        minDistance = distance;
                        localClosestIndex = parseInt(marker.dataset.index);
                    }
                    const scale = Math.exp(-(distance * distance) / (2 * sigma * sigma));
                    const height = minHeight + (maxHeight - minHeight) * scale;
                    marker.style.height = `${height.toFixed(2)}px`;
                });
                closestIndex = localClosestIndex;
            }

            /**
             * Updates the displayed text to the currently centered option.
             */
            function updateDisplay() {
                if (closestIndex !== -1 && optionDisplay.textContent !== options[closestIndex]) {
                    optionDisplay.style.opacity = '0';
                    setTimeout(() => {
                        optionDisplay.textContent = options[closestIndex];
                        optionDisplay.style.opacity = '1';
                    }, 150);
                }
            }

            function findClosestOption() {
                return closestIndex;
            }

            /**
             * Snaps the scroll position to the closest option marker.
             */
            function snapToClosest() {
                const closestIndex = findClosestOption();
                const targetMarker = document.querySelector(`.option-marker[data-index='${closestIndex}']`);
                if (targetMarker) {
                    var targetScroll = targetMarker.parentElement.offsetLeft
                    targetScroll -= (timelineContainer.clientWidth / 2);
                    timelineContainer.scrollTo({ left: targetScroll, behavior: 'smooth' });
                }
            }

            // --- Event Listeners ---
            let isDown = false;
            let startX;
            let scrollLeft;
            let snapTimer;

            timelineContainer.addEventListener('mousedown', (e) => { isDown = true; startX = e.pageX - timelineContainer.offsetLeft; scrollLeft = timelineContainer.scrollLeft; });
            timelineContainer.addEventListener('mouseleave', () => { isDown = false; });
            timelineContainer.addEventListener('mouseup', () => { isDown = false; });
            timelineContainer.addEventListener('mousemove', (e) => {
                if (!isDown) return;
                e.preventDefault();
                const x = e.pageX - timelineContainer.offsetLeft;
                const walk = (x - startX) * 2;
                timelineContainer.scrollLeft = scrollLeft - walk;
                console.log(timelineContainer.scrollLeft);
            });

            timelineContainer.addEventListener('wheel', (e) => {
                e.preventDefault();
                timelineContainer.scrollLeft += e.deltaX + e.deltaY; // Also consider vertical wheel for trackpads
            });

            timelineContainer.addEventListener('scroll', () => {
                updateLineHeights();
                updateDisplay();
                clearTimeout(snapTimer);
                if (!isDown) { // Only snap if the user is not actively dragging
                    snapTimer = setTimeout(snapToClosest, 150);
                }
            });

            // --- Initialization ---
            renderTimeline();
            // Start snapped to the first option
            setTimeout(() => {
                updateLineHeights();
                updateDisplay();
            }, 100);
        });
    </script>
</body>

</html>
